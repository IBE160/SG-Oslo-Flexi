name: CI Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest pytest-asyncio httpx
          
      - name: Run Backend Tests
        # Runs pytest if tests exist, otherwise echoes a message (safe no-op for now)
        run: |
          if [ -d "backend/tests" ] && [ "$(ls -A backend/tests)" ]; then
            pytest backend/tests
          else
            echo "No backend tests found yet. Skipping."
          fi

  frontend-e2e-test:
    runs-on: ubuntu-latest
    continue-on-error: true # TEMP: frontend not implemented yet
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        
      - name: Run E2E Tests
        run: npm run test:e2e
        env:
          CI: true
